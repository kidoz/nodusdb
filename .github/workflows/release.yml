name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # for keyless cosign signing
  packages: write

jobs:
  release:
    name: Build and smoke-test; publish tagged releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --locked --release --bin nodus_server --bin nodus_cli

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/nodus_server dist/
          cp target/release/nodus_cli dist/nodusctl

      - name: Generate checksums
        working-directory: dist
        run: sha256sum nodus_server nodusctl > SHA256SUMS

      - name: Generate binary SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Build production image
        run: docker build -f deploy/docker/Dockerfile -t nodusdb:${{ github.sha }} .

      - name: Smoke-test production image
        run: python3 -B tools/testing/container_smoke.py --image nodusdb:${{ github.sha }}

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: nodusdb:${{ github.sha }}
          format: spdx-json
          output-file: dist/nodusdb-image.spdx.json

      - name: Install cosign
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums (keyless)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          COSIGN_YES: "true"
        run: cosign sign-blob --yes dist/SHA256SUMS --bundle dist/SHA256SUMS.cosign.bundle

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Helm image and publish to GHCR
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          IMAGE: ghcr.io/kidoz/nodusdb
          LOCAL_IMAGE: nodusdb:${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python3 - <<'PY'
          import os
          import pathlib
          import re

          values = pathlib.Path("deploy/helm/nodusdb/values.yaml").read_text()
          chart = pathlib.Path("deploy/helm/nodusdb/Chart.yaml").read_text()
          repository = re.search(r"(?m)^  repository:\s*(\S+)\s*$", values)
          app_version = re.search(r"(?m)^appVersion:\s*[\"']?([^\"'\s]+)", chart)
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if not repository or repository.group(1) != os.environ["IMAGE"]:
              raise SystemExit("Helm image repository does not match the GHCR repository")
          if not app_version or app_version.group(1) != expected:
              raise SystemExit("Helm appVersion does not match the published image tag")
          PY
          docker tag "$LOCAL_IMAGE" "$IMAGE:$version"
          docker tag "$LOCAL_IMAGE" "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:$version"
          docker push "$IMAGE:$RELEASE_TAG"

      - name: Sign container image (keyless)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          COSIGN_YES: "true"
          IMAGE: ghcr.io/kidoz/nodusdb
          RELEASE_TAG: ${{ github.ref_name }}
        run: cosign sign --yes "$IMAGE:${RELEASE_TAG#v}"

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nodus_server
            dist/nodusctl
            dist/SHA256SUMS
            dist/SHA256SUMS.cosign.bundle
            dist/sbom.spdx.json
            dist/nodusdb-image.spdx.json
