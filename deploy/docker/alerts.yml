groups:
  - name: nodusdb
    rules:
      - alert: NodusNodeDown
        expr: up{job="nodusd"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NodusDB node is down"
          description: "{{ $labels.instance }} has been unreachable for over 1 minute."

      - alert: NodusHighQueryErrorRate
        expr: |
          rate(nodus_query_errors_total[5m])
            / clamp_min(rate(nodus_queries_total[5m]), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated query error rate"
          description: "More than 5% of queries are failing on {{ $labels.instance }}."

      - alert: NodusNoActiveSessions
        expr: nodus_active_sessions == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No active sessions"
          description: "{{ $labels.instance }} has had no client sessions for 30 minutes."

  - name: nodusdb-restore-drills
    rules:
      - alert: NodusRestoreDrillMissing
        expr: absent(nodus_restore_drill_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "No successful NodusDB restore drill is reported"
          description: "The restore-drill metrics pipeline is absent or no drill has ever succeeded."

      - alert: NodusRestoreDrillFailed
        expr: nodus_restore_drill_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NodusDB restore drill failed"
          description: "The latest {{ $labels.drill }} restore drill failed its recovery or semantic checks."

      - alert: NodusRestoreDrillStale
        expr: time() - nodus_restore_drill_last_success_timestamp_seconds > 93600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NodusDB restore drill is stale"
          description: "The last successful {{ $labels.drill }} restore drill is more than 26 hours old."
